[package]
name = "spectape"
version = "0.2.2"
description = "ZX Spectrum TZX/TAP tape editor"
authors = ["ajbanck"]
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
name = "spectape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For the "WebView2 missing" message box; the runtime is not part of every Windows 10 install.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

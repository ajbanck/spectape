[package]
name = "spectape"
version = "0.2.0"
description = "ZX Spectrum TZX/TAP tape editor"
authors = ["ajbanck"]
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
name = "spectape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Typecheck, test and build web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The tape core is Rust compiled to wasm, and the npm scripts build it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci
      - run: npm run core:test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist

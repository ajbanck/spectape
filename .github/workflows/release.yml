name: Release desktop builds

# Builds the desktop app for macOS (universal), Linux and Windows and attaches the
# bundles to a GitHub release. Runs on version tags, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary; the app declares macOS 10.13+ and needs Safari 14.1's WebKit or newer.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported LTS: sets the glibc floor and ships webkit2gtk 4.1.
          - os: ubuntu-22.04
            args: ''
            targets: ''
          - os: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'SpecTape ${{ github.ref_name }}'
          releaseBody: 'Desktop builds. macOS bundles are unsigned: right-click, Open on first launch.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

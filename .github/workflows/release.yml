name: Release desktop builds

# Builds the desktop app for macOS (universal), Linux and Windows and attaches the
# bundles to a GitHub release. Runs on version tags, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary; the app declares macOS 10.13+ and needs Safari 14.1's WebKit or newer.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
          # Oldest supported LTS: sets the glibc floor and ships webkit2gtk 4.1.
          - os: ubuntu-22.04
            args: ''
            targets: wasm32-unknown-unknown
          - os: windows-latest
            args: ''
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            core

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'SpecTape ${{ github.ref_name }}'
          releaseBody: 'Desktop builds. macOS bundles are unsigned: right-click, Open on first launch.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bare exe, for running SpecTape without installing it. It carries the whole app
      # (the front end is compiled in) and only needs the WebView2 runtime, which Windows 11
      # and up-to-date Windows 10 already have.
      - name: Attach the portable Windows exe
        if: matrix.os == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $portable = "SpecTape_${version}_x64_portable.exe"
          Copy-Item src-tauri/target/release/spectape.exe $portable
          gh release upload ${{ github.ref_name }} $portable --clobber
